version = 1

[[environments]]
name = "main"

[[environments]]
name = "staging"

[[workspaces]]
path = "infra/named"
environments = ["main"]
outputs.environment_name = { visibility = "internal" }

[[workspaces]]
path = "apps/shared/infra"
environments = ["*"]

[[workspaces]]
path = "apps/staging/infra"
environments = ["staging"]
